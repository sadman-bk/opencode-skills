name: Bug
description: A skill did the wrong thing in a real session. One bug per issue.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Keep it short and put the repro first. If an agent wrote this for you, cut it down to the repro before you post. See [CONTRIBUTING.md](https://github.com/sadman-bk/matt-opencode-skills/blob/main/CONTRIBUTING.md).

        Bugs in `skills/misc/` are not fixed (see [`.out-of-scope/frozen-misc-skills.md`](https://github.com/sadman-bk/matt-opencode-skills/blob/main/.out-of-scope/frozen-misc-skills.md)).
  - type: input
    id: skill
    attributes:
      label: Skill
      description: Which skill, e.g. `to-tickets`, `grilling`.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The plugin version (`package.json`), or the commit SHA you installed from. Many bugs are already fixed on `main`.
      placeholder: 2.0.0, or 4588b32
    validations:
      required: true
  - type: input
    id: opencode-version
    attributes:
      label: OpenCode version
      description: Output of `opencode --version`, e.g. 2.3.2. Say whether the plugin came from a git ref, a local path, or `buckets` overrides.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and effort
      description: e.g. Opus, high effort. Roughly how full was the context when it happened?
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The smallest steps that show the bug, and what the skill did. Paste the relevant part of the session.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What the skill should have done instead, and which line of the SKILL.md (if any) says so.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This issue is about one problem.
          required: true
        - label: I searched open and closed issues for a duplicate.
          required: true
